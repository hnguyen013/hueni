# Render Blueprint — Task 5.3
#
# Cách dùng: đẩy code lên GitHub, vào https://dashboard.render.com/blueprints
# -> "New Blueprint Instance" -> chọn repo này. Render tự đọc file này để
# tạo 1 Web Service, tự sinh SECRET_KEY. Chi tiết từng bước: xem DEPLOY.md.
#
# LƯU Ý: KHÔNG dùng Postgres của Render nữa (free plan tự xoá DB sau 30
# ngày — xem mục 9 DEPLOY.md). DATABASE_URL giờ trỏ sang Neon (free vĩnh
# viễn), phải tự dán connection string vào Environment trên Dashboard
# (không khai trong file này vì đây là bí mật, không nên commit lên Git).

services:
  - type: web
    name: hueni
    runtime: python
    plan: free
    region: singapore
    buildCommand: >-
      pip install -r requirements.txt &&
      npm install &&
      npm run build &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate --noinput &&
      (python manage.py createsuperuser --noinput || true)
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      # Đặt cứng domain thật thay vì fromService (service tự tham chiếu
      # chính nó qua fromService đôi khi không resolve đúng lúc env var
      # được set — đã gặp lỗi 400 Bad Request / DisallowedHost thực tế do
      # ALLOWED_HOSTS rỗng/sai). Nếu đổi tên service, nhớ sửa lại dòng này.
      - key: DJANGO_ALLOWED_HOSTS
        value: "hueni.onrender.com"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://hueni.onrender.com"
      # KHÔNG dùng fromDatabase nữa (đã bỏ Postgres của Render). Dán
      # connection string Neon vào đây trực tiếp trên Render Dashboard
      # (Environment tab) — sync: false để Blueprint KHÔNG tự xoá/ghi đè
      # giá trị bạn nhập tay mỗi lần sync lại từ file này.
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: USE_S3_MEDIA
        value: "False"
