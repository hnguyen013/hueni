# Render Blueprint — Task 5.3
#
# Cách dùng: đẩy code lên GitHub, vào https://dashboard.render.com/blueprints
# -> "New Blueprint Instance" -> chọn repo này. Render tự đọc file này để
# tạo 1 Web Service + 1 Postgres database, tự nối DATABASE_URL, tự sinh
# SECRET_KEY. Chi tiết từng bước: xem DEPLOY.md.

databases:
  - name: hoclieuso-db
    plan: free
    databaseName: hoclieuso
    user: hoclieuso
    region: singapore  # BẮT BUỘC khớp region với web service bên dưới —
    # internal DATABASE_URL của Render chỉ resolve được giữa các service
    # CÙNG region. Thiếu dòng này, Render tự rơi database vào region mặc
    # định (Oregon) trong khi web service ở Singapore → migrate lúc build
    # báo lỗi DNS "Name or service not known" (đã gặp thực tế, xem log).

services:
  - type: web
    name: hueni
    runtime: python
    plan: free
    region: singapore
    buildCommand: >-
      pip install -r requirements.txt &&
      npm install &&
      npm run build &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      # Render tự thay ${RENDER_EXTERNAL_HOSTNAME} bằng domain thật lúc chạy
      # (hueni.onrender.com) — không cần tự điền tay.
      - key: DJANGO_ALLOWED_HOSTS
        value: "hueni.onrender.com"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://hueni.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: hoclieuso-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: USE_S3_MEDIA
        value: "False"
